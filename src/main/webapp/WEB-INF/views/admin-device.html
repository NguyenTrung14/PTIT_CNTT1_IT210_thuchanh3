<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout-admin :: adminHead('Quản lý kho thiết bị')}"></head>
<body>
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Quản lý kho thiết bị</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="fas fa-plus me-2"></i>Thêm thiết bị
        </button>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Hình ảnh</th>
                            <th>Thông tin thiết bị</th>
                            <th>Số lượng tồn</th>
                            <th class="text-end pe-4">Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="dev : ${devices}">
                            <td class="ps-4 fw-bold" th:text="${dev.id}"></td>
                            <td>
                                <img th:src="${dev.image}" width="60" height="60" class="shadow-sm border">
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${dev.name}"></div>
                                <small class="text-muted">PTIT IT Lab Resource</small>
                            </td>
                            <td>
                                <div class="progress" style="height: 8px; width: 100px;">
                                    <div class="progress-bar" th:classappend="${dev.quantity < 5 ? 'bg-danger' : 'bg-success'}"
                                         role="progressbar" th:style="'width: ' + (${dev.quantity} * 10) + '%'"></div>
                                </div>
                                <small class="fw-bold" th:text="${dev.quantity} + ' cái'"></small>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-outline-warning btn-sm me-1"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#editModal' + ${dev.id}">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button type="button" class="btn btn-outline-danger btn-sm"
                                        data-bs-toggle="modal" th:data-bs-target="'#deleteModal' + ${dev.id}">
                                    <i class="fas fa-trash"></i>
                                </button>

                                <div class="modal fade" th:id="'deleteModal' + ${dev.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content text-start">
                                            <div class="modal-header">
                                                <h5 class="modal-title fw-bold text-dark">Xác nhận xóa</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body text-dark">
                                                Bạn có chắc chắn muốn xóa thiết bị <strong th:text="${dev.name}"></strong>?
                                                <p class="text-muted small mt-2 mb-0">Hành động này không thể hoàn tác.</p>
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                                <a th:href="@{/admin/devices/delete/{id}(id=${dev.id})}" class="btn btn-danger">Xóa ngay</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="modal fade" th:id="'editModal' + ${dev.id}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog">
                                        <form th:action="@{/admin/devices/update}" th:object="${deviceDTO}" method="post" class="modal-content text-start">
                                            <div class="modal-header">
                                                <h5 class="modal-title text-dark">Cập nhật thiết bị</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>

                                            <div class="modal-body text-dark">
                                                <input type="hidden" name="id" th:value="${dev.id}">

                                                <div class="mb-3">
                                                    <label class="form-label">Tên thiết bị</label>
                                                    <input type="text" name="name"
                                                           th:value="${errorId == dev.id ? deviceDTO.name : dev.name}"
                                                           class="form-control"
                                                           th:classappend="${errorId == dev.id && #fields.hasErrors('name')} ? 'is-invalid'">
                                                    <div class="invalid-feedback" th:if="${errorId == dev.id}" th:errors="*{name}"></div>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Số lượng</label>
                                                    <input type="number" name="quantity"
                                                           th:value="${errorId == dev.id ? deviceDTO.quantity : dev.quantity}"
                                                           class="form-control"
                                                           th:classappend="${errorId == dev.id && #fields.hasErrors('quantity')} ? 'is-invalid'">
                                                    <div class="invalid-feedback" th:if="${errorId == dev.id}" th:errors="*{quantity}"></div>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">URL Ảnh</label>
                                                    <input type="text" name="image" th:value="${dev.image}" class="form-control">
                                                </div>
                                            </div>

                                            <div class="modal-footer">
                                                <a th:href="@{/admin/devices}" class="btn btn-secondary">Hủy</a>
                                                <button type="submit" class="btn btn-warning text-white">Lưu thay đổi</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form th:action="@{/admin/devices/add}" th:object="${deviceDTO}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-dark">Thêm thiết bị mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-dark">
                <div class="mb-3">
                    <label class="form-label fw-bold">Tên thiết bị</label>
                    <input type="text" th:field="*{name}" class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Số lượng tồn</label>
                    <input type="number" th:field="*{quantity}" class="form-control"
                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">URL Ảnh</label>
                    <input type="text" th:field="*{image}" class="form-control"
                           th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{image}"></div>
                </div>
            </div>
            <div class="modal-footer">
                <a th:href="@{/admin/devices}" class="btn btn-secondary">Hủy</a>
                <button type="submit" class="btn btn-primary fw-bold">Thêm vào kho</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        /*[# th:if="${showAddModal}"]*/
        new bootstrap.Modal(document.getElementById('addModal')).show();
        /*[/]*/

    });
</script>
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        /*[# th:if="${showEditModal}"]*/
        var id = /*[[${errorId}]]*/ 0;
        var modal = document.getElementById('editModal' + id);
        if (modal) {
            new bootstrap.Modal(modal).show();
        }
        /*[/]*/

    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const addModal = document.getElementById('addModal');
        addModal.addEventListener('hidden.bs.modal', function () {
            addModal.querySelector("form").reset();
            addModal.querySelectorAll(".is-invalid")
                .forEach(e => e.classList.remove("is-invalid"));
            addModal.querySelectorAll(".invalid-feedback")
                .forEach(e => e.innerHTML = "");
        });
    });
</script>
</body>
</html>
