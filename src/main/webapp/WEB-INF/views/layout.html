<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="commonHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${pageTitle}">IT Lab Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        .error-message { color: red; font-size: 0.875em; }
        .is-invalid { border-color: #dc3545 !important; }
        footer { background: #f8f9fa; }
    </style>
</head>

<body>
<header th:fragment="commonHeader">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/devices">PTIT IT LAB</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/devices">Danh mục</a>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="commonFooter" class="mt-5 py-4 border-top text-center text-muted">
    <div class="container">
        <small>&copy; 2026 - Hệ thống Quản lý IT Lab - PTIT</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
