<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: commonHead('Danh mục thiết bị - PTIT')}"></head>
<body>
<div th:replace="~{layout :: commonHeader}"></div>

<div class="container py-5">
  <div class="text-center mb-5">
    <h1 class="page-title">Danh mục thiết bị / phòng Lab</h1>
    <p class="text-muted mb-0">Sinh viên xem danh sách thiết bị và đăng ký mượn trực tuyến</p>
  </div>

  <div class="row g-4" th:if="${devices != null and !#lists.isEmpty(devices)}">
    <div class="col-md-6 col-lg-4" th:each="device : ${devices}">
      <div class="card device-card">
        <img th:src="${device.image}" class="device-img" th:alt="${device.name}">
        <div class="card-body d-flex flex-column">
          <div class="mb-2">
                        <span class="badge rounded-pill text-bg-primary"
                              th:text="${device.type == 'LAB' ? 'PHÒNG LAB' : 'THIẾT BỊ'}"></span>
          </div>
          <h5 class="card-title fw-bold" th:text="${device.name}"></h5>
          <p class="card-text" th:classappend="${device.quantity > 0} ? 'stock-ok' : 'stock-low'">
            Số lượng còn: <span th:text="${device.quantity}">0</span>
          </p>
          <a th:if="${device.quantity > 0}"
             th:href="@{/borrow(deviceId=${device.id})}"
             class="btn btn-success mt-auto fw-bold">
            <i class="fas fa-plus-circle me-1"></i> Đăng ký mượn
          </a>

          <button th:if="${device.quantity <= 0}"
                  class="btn btn-secondary mt-auto fw-bold"
                  disabled>
            <i class="fas fa-exclamation-triangle me-1"></i> Hết hàng
          </button>
        </div>
      </div>
    </div>
  </div>

  <div th:if="${devices == null or #lists.isEmpty(devices)}" class="alert alert-warning text-center">
    Hiện chưa có thiết bị nào trong hệ thống.
  </div>
</div>

<footer th:replace="~{layout :: commonFooter}"></footer>
</body>
</html>
